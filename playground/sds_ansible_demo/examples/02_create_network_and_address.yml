---
- name: Create the demo network, host address and host A record
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../config.json
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
    fqdn: '{{ hostname }}.{{ dns_zone }}'
    network_size: '{{ 2 ** (32 - (network.split("/")[1] | int)) }}'
    zones: '{{ dns_current.results[0].json | default([]) }}'
    records: '{{ host_snapshot.json | default([]) }}'
    ttl_api_rows: |-
      {{ [ttl_update.json] if ttl_update.json | default(none) is mapping
         else (ttl_update.json if ttl_update.json | default(none) | type_debug == 'list' else []) }}
    ttl_api_codes: '{{ ttl_api_rows | selectattr(''errno'', ''defined'') | map(attribute=''errno'') | map(''int'', -1)
      | list }}'
    ttl_api_message: |-
      {{ (ttl_api_rows | selectattr('errmsg', 'defined') | map(attribute='errmsg') | map('string') | join('; ')
          | replace((solidserver.username ~ ':' ~ solidserver.password) | b64encode, '[redacted]')
          | replace(solidserver.password | urlencode, '[redacted]')
          | replace(solidserver.password, '[redacted]')
          | replace(solidserver.username, '[redacted]')) | default('No API message returned', true) }}
    ttl_diagnostic: >-
      HTTP={{ ttl_update.status | default(-1) }}, response_format={{ ttl_update.json | default(none) | type_debug }},
      API_errno={{ ttl_api_codes }}, API_message={{ ttl_api_message }}.
    initial_records: '{{ dns_current.results[1].json | default([]) }}'
  module_defaults:
    ansible.builtin.uri:
      url_username: '{{ solidserver.username }}'
      url_password: '{{ solidserver.password }}'
      force_basic_auth: true
      validate_certs: '{{ solidserver.check_tls }}'
      ca_path: '{{ ca_file | default(omit, true) }}'
      follow_redirects: none
      use_netrc: false
      return_content: true
      status_code:
        - 200
        - 204
  tasks:
    - name: '[SOLIDserver REST] Inspect the network and address before creation'
      ansible.builtin.uri:
        url: >-
          https://{{ solidserver.host }}/rest/{{ item.service }}?{{ {'WHERE': item.where, 'limit': 2} | urlencode }}
      loop:
        - service: ip_block_subnet_list
          where: >-
            site_name='{{ space }}' and (subnet_name='{{ network_name }}' or (start_hostaddr='{{ network.split('/')[0]
            }}' and subnet_size={{ network_size }}))
        - service: ip_address_list
          where: site_name='{{ space }}' and type<>'free' and (hostaddr='{{ address }}' or name='{{ fqdn }}')
      register: current
      failed_when: >-
        current.status not in [200, 204] or (current.status == 200 and (current.json is not defined or current.json |
        type_debug != 'list')) or (current.json | default([]) | selectattr('errno', 'defined') | rejectattr('errno',
        'in', [0, '0']) | list | length > 0)
      no_log: true
    - name: Refuse conflicting existing resources
      ansible.builtin.assert:
        that:
          - existing_network | length <= 1
          - existing_address | length <= 1
          - |-
            existing_network | length == 0 or (existing_network[0].subnet_name == network_name and
             existing_network[0].start_hostaddr == network.split('/')[0] and
             existing_network[0].subnet_size | int == network_size | int and
             existing_network[0].is_terminal | int == 1)
          - |-
            existing_address | length == 0 or (existing_network | length == 1 and
             existing_address[0].hostaddr == address and
             existing_address[0].name == fqdn and
             existing_address[0].subnet_id | string == existing_network[0].subnet_id | string)
        fail_msg: Existing resources conflict with the demo settings. Use a dedicated unused scope.
      vars:
        existing_network: '{{ current.results[0].json | default([]) }}'
        existing_address: '{{ current.results[1].json | default([]) }}'
    - name: '[SOLIDserver collection] Ensure the demo network exists'
      community.efficientip.solidserver_ipam_network:
        provider: '{{ solidserver }}'
        space: '{{ space }}'
        parent: '{{ parent_network }}'
        subnet: '{{ network }}'
        name: '{{ network_name }}'
        is_terminal: true
        update: false
        state: present
      when: current.results[0].json | default([]) | length == 0
      no_log: true
    - name: '[SOLIDserver collection] Ensure the persistent IP address exists'
      community.efficientip.solidserver_ipam_ip:
        provider: '{{ solidserver }}'
        space: '{{ space }}'
        subnet: '{{ network }}'
        ip: '{{ address }}'
        hostname: '{{ fqdn }}'
        update: false
        state: present
      when: current.results[1].json | default([]) | length == 0
      no_log: true
    - name: '[SOLIDserver REST] Inspect the zone and existing name'
      ansible.builtin.uri:
        url: >-
          https://{{ solidserver.host }}/rest/{{ item.service }}?{{ {'WHERE': item.where, 'limit': 2} | urlencode }}
      loop:
        - service: dns_zone_list
          where: dns_name='{{ dns_server }}' and dnszone_name='{{ dns_zone }}'
        - service: dns_rr_list
          where: dns_name='{{ dns_server }}' and rr_full_name='{{ fqdn }}'
      register: dns_current
      failed_when: >-
        dns_current.status not in [200, 204] or (dns_current.status == 200 and (dns_current.json is not defined or dns_current.json
        | type_debug != 'list')) or (dns_current.json | default([]) | selectattr('errno', 'defined') | rejectattr('errno',
        'in', [0, '0']) | list | length > 0)
      no_log: true
    - name: Require one default-view forward zone
      ansible.builtin.assert:
        that:
          - zones | length == 1
          - zones[0].dnsview_id | default('0', true) | string == '0'
          - zones[0].dnszone_is_reverse | default('0') | int == 0
        fail_msg: >-
          Expected one forward zone in the default DNS view for {{ dns_server }}/{{ dns_zone }}. Returned {{ zones |
          length }} zone(s). No DNS write was attempted.
    - name: Require at most one existing record for the demo name
      ansible.builtin.assert:
        that:
          - initial_records | length <= 1
        fail_msg: >-
          The query returned at least {{ initial_records | length }} initial_records for {{ fqdn }} on {{ dns_server
          }} (the query limit is 2). This demo expects at most one. Inspect the existing initial_records and views. No
          DNS write was attempted.
    - name: Require the existing DNS record to match the requested identity
      ansible.builtin.assert:
        that:
          - initial_records[0].rr_type | default('') == 'A'
          - initial_records[0].value1 | default('') == address
          - initial_records[0].dnsview_id | default('0', true) | string == '0'
          - initial_records[0].dnszone_name | default('') == dns_zone
          - initial_records[0].rr_id | default(0) | int > 0
        fail_msg: >-
          Existing DNS record differs for {{ fqdn }} on {{ dns_server }}. Requested: type=A, address={{ address }}, TTL={{
          ttl }}, view_id=0. Existing: record_id={{ initial_records[0].rr_id | default('not returned') }}, type={{ initial_records[0].rr_type
          | default('not returned') }}, address={{ initial_records[0].value1 | default('not returned') }}, TTL={{ initial_records[0].ttl
          | default('not returned') }}, view_id={{ initial_records[0].dnsview_id | default('not returned') }}. No DNS
          write was attempted. Review the difference before changing the saved configuration or the existing record.
      when: initial_records | length == 1
    - name: '[SOLIDserver collection] Ensure the DNS A record exists'
      community.efficientip.solidserver_dns_rr:
        provider: '{{ solidserver }}'
        dnsserver: '{{ dns_server }}'
        dnszone: '{{ dns_zone }}'
        name: '{{ fqdn }}'
        rrtype: A
        rrvalues:
          - '{{ address }}'
        rrttl: '{{ ttl }}'
        update: false
        state: present
      when: dns_current.results[1].json | default([]) | length == 0
      no_log: true
    - name: '[SOLIDserver REST] Read the host A record before applying the selected TTL'
      ansible.builtin.uri:
        url: >-
          https://{{ solidserver.host }}/rest/dns_rr_list?{{ {'WHERE': "dns_name='" ~ dns_server ~ "' and rr_full_name='"
          ~ fqdn ~ "'", 'limit': 2} | urlencode }}
      register: host_snapshot
      failed_when: |-
        host_snapshot.status not in [200, 204] or (host_snapshot.status == 200 and
         (host_snapshot.json is not defined or host_snapshot.json | type_debug != 'list')) or
        (host_snapshot.json | default([]) | selectattr('errno', 'defined') | rejectattr('errno', 'in', [0, '0']) | list | length > 0)
      no_log: true
    - name: Require the current host A record to match the IPAM host
      ansible.builtin.assert:
        that:
          - records | length == 1
          - records[0].rr_type == 'A'
          - records[0].value1 == address
          - records[0].dnsview_id | default('0', true) | string == '0'
          - records[0].dnszone_name == dns_zone
          - records[0].rr_id | int > 0
        fail_msg: The host A record does not match {{ fqdn }} -> {{ address }}. No successful host provisioning is claimed.
    - name: '[SOLIDserver REST] Apply the requested TTL to the matching existing record'
      ansible.builtin.uri:
        url: >-
          https://{{ solidserver.host }}/rest/dns_rr_add?{{ {'rr_id': records[0].rr_id, 'rr_ttl': ttl, 'add_flag': 'edit_only'}
          | urlencode }}
        method: PUT
        status_code:
          - 200
          - 201
          - 204
      when:
        - records | length == 1
        - records[0].ttl | default(-1) | int != ttl | int
      register: ttl_update
      failed_when: false
      changed_when: false
      no_log: true
    - name: Validate the TTL update response and show any API error safely
      ansible.builtin.assert:
        that:
          - ttl_update.status | default(-1) | int in [200, 201, 204]
          - ttl_api_codes | reject('equalto', 0) | list | length == 0
        fail_msg: >-
          TTL update was not confirmed for {{ fqdn }}, record_id={{ records[0].rr_id }}, requested_TTL={{ ttl }}. {{
          ttl_diagnostic }} No successful publication is claimed.
      when: ttl_update is not skipped
    - name: '[SOLIDserver REST] Read back the DNS record and requested TTL'
      ansible.builtin.uri:
        url: >-
          https://{{ solidserver.host }}/rest/dns_rr_list?{{ {'WHERE': "dns_name='" ~ dns_server ~ "' and rr_full_name='"
          ~ fqdn ~ "'", 'limit': 2} | urlencode }}
      register: dns_readback
      failed_when: |-
        dns_readback.status not in [200, 204] or (dns_readback.status == 200 and
         (dns_readback.json is not defined or dns_readback.json | type_debug != 'list')) or
        (dns_readback.json | default([]) | selectattr('errno', 'defined') | rejectattr('errno', 'in', [0, '0']) | list | length > 0)
      no_log: true
    - name: Verify the DNS record has the user-selected TTL
      ansible.builtin.assert:
        that:
          - actual | length == 1
          - actual[0].rr_type | default('') == 'A'
          - actual[0].value1 | default('') == address
          - actual[0].ttl | default(-1) | int == ttl | int
          - actual[0].dnsview_id | default('0', true) | string == '0'
          - actual[0].dnszone_name | default('') == dns_zone
          - records | length == 0 or actual[0].rr_id | string == records[0].rr_id | string
        fail_msg: >-
          DNS read-back does not match {{ fqdn }} -> {{ address }} with TTL={{ ttl }} in the configured default-view
          zone. No successful publication is claimed. Returned_records={{ actual | length }}, observed_TTL={{ actual[0].ttl
          | default('not returned') if actual | length == 1 else 'not available' }}. {{ ttl_diagnostic if ttl_update
          is not skipped else 'No TTL update was needed.' }} Check the DNS record and any IPAM-to-DNS policy that manages
          it.
      changed_when: ttl_update is not skipped
      vars:
        actual: '{{ dns_readback.json | default([]) }}'
    - name: Show the provisioned host and its DNS record
      ansible.builtin.debug:
        msg:
          Network: '{{ network }}'
          Host: '{{ fqdn }}'
          Address: '{{ address }}'
          DNS record: A
          TTL: '{{ ttl }} seconds'
