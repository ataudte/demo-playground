---
- name: Create the application CNAME alias
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../config.json
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
    fqdn: '{{ hostname }}.{{ dns_zone }}'
    zones: '{{ current.results[0].json | default([]) }}'
    records: '{{ alias_snapshot.json | default([]) }}'
    ttl_api_rows: |-
      {{ [ttl_update.json] if ttl_update.json | default(none) is mapping
         else (ttl_update.json if ttl_update.json | default(none) | type_debug == 'list' else []) }}
    ttl_api_codes: '{{ ttl_api_rows | selectattr(''errno'', ''defined'') | map(attribute=''errno'') | map(''int'', -1)
      | list }}'
    ttl_api_message: |-
      {{ (ttl_api_rows | selectattr('errmsg', 'defined') | map(attribute='errmsg') | map('string') | join('; ')
          | replace((solidserver.username ~ ':' ~ solidserver.password) | b64encode, '[redacted]')
          | replace(solidserver.password | urlencode, '[redacted]')
          | replace(solidserver.password, '[redacted]')
          | replace(solidserver.username, '[redacted]')) | default('No API message returned', true) }}
    ttl_diagnostic: >-
      HTTP={{ ttl_update.status | default(-1) }}, response_format={{ ttl_update.json | default(none) | type_debug }},
      API_errno={{ ttl_api_codes }}, API_message={{ ttl_api_message }}.
    app_fqdn: '{{ app_alias | default(hostname[:59] ~ "-app") }}.{{ dns_zone }}'
    host_records: '{{ current.results[1].json | default([]) }}'
    existing_aliases: '{{ current.results[2].json | default([]) }}'
  module_defaults:
    ansible.builtin.uri:
      url_username: '{{ solidserver.username }}'
      url_password: '{{ solidserver.password }}'
      force_basic_auth: true
      validate_certs: '{{ solidserver.check_tls }}'
      ca_path: '{{ ca_file | default(omit, true) }}'
      follow_redirects: none
      use_netrc: false
      return_content: true
      status_code:
        - 200
        - 204
  tasks:
    - name: '[SOLIDserver REST] Inspect the zone, host A record and application name'
      ansible.builtin.uri:
        url: >-
          https://{{ solidserver.host }}/rest/{{ item.service }}?{{ {'WHERE': item.where, 'limit': 2} | urlencode }}
      loop:
        - service: dns_zone_list
          where: dns_name='{{ dns_server }}' and dnszone_name='{{ dns_zone }}'
        - service: dns_rr_list
          where: dns_name='{{ dns_server }}' and rr_full_name='{{ fqdn }}'
        - service: dns_rr_list
          where: dns_name='{{ dns_server }}' and rr_full_name='{{ app_fqdn }}'
      register: current
      failed_when: >-
        current.status not in [200, 204] or (current.status == 200 and (current.json is not defined or current.json |
        type_debug != 'list')) or (current.json | default([]) | selectattr('errno', 'defined') | rejectattr('errno',
        'in', [0, '0']) | list | length > 0)
      no_log: true
    - name: Require one default-view forward zone
      ansible.builtin.assert:
        that:
          - zones | length == 1
          - zones[0].dnsview_id | default('0', true) | string == '0'
          - zones[0].dnszone_is_reverse | default('0') | int == 0
        fail_msg: >-
          Expected one forward zone in the default DNS view for {{ dns_server }}/{{ dns_zone }}. Returned {{ zones |
          length }} zone(s). No DNS write was attempted.
    - name: Require the host A record created or ensured by step 02
      ansible.builtin.assert:
        that:
          - host_records | length == 1
          - host_records[0].rr_type == 'A'
          - host_records[0].value1 == address
          - host_records[0].dnsview_id | default('0', true) | string == '0'
          - host_records[0].dnszone_name == dns_zone
        fail_msg: Run step 02 first. The configured host must have one matching A record in the default-view zone.
    - name: Refuse a conflicting record at the application alias name
      ansible.builtin.assert:
        that:
          - app_fqdn | lower != fqdn | lower
          - existing_aliases | length <= 1
          - >-
            existing_aliases | length == 0 or (existing_aliases[0].rr_type == 'CNAME' and existing_aliases[0].value1
            | lower | regex_replace('[.]$', '') == fqdn | lower and existing_aliases[0].dnsview_id | default('0', true)
            | string == '0' and existing_aliases[0].dnszone_name == dns_zone)
        fail_msg: >-
          The application name {{ app_fqdn }} is occupied by a different record or target. Expected one CNAME pointing
          to {{ fqdn }}. No application DNS write was attempted.
    - name: '[SOLIDserver collection] Create the application CNAME alias'
      community.efficientip.solidserver_dns_rr:
        provider: '{{ solidserver }}'
        dnsserver: '{{ dns_server }}'
        dnszone: '{{ dns_zone }}'
        name: '{{ app_fqdn }}'
        rrtype: CNAME
        rrvalues:
          - '{{ fqdn }}.'
        rrttl: '{{ ttl }}'
        update: false
        state: present
      when: existing_aliases | length == 0
      no_log: true
    - name: '[SOLIDserver REST] Read the application alias before setting its TTL'
      ansible.builtin.uri:
        url: >-
          https://{{ solidserver.host }}/rest/dns_rr_list?{{ {'WHERE': "dns_name='" ~ dns_server ~ "' and rr_full_name='"
          ~ app_fqdn ~ "'", 'limit': 2} | urlencode }}
      register: alias_snapshot
      failed_when: |-
        alias_snapshot.status not in [200, 204] or (alias_snapshot.status == 200 and
         (alias_snapshot.json is not defined or alias_snapshot.json | type_debug != 'list')) or
        (alias_snapshot.json | default([]) | selectattr('errno', 'defined') | rejectattr('errno', 'in', [0, '0']) | list | length > 0)
      no_log: true
    - name: Require the application CNAME to point to the configured host
      ansible.builtin.assert:
        that:
          - records | length == 1
          - records[0].rr_type == 'CNAME'
          - records[0].value1 | default('') | lower | regex_replace('[.]$', '') == fqdn | lower
          - records[0].dnsview_id | default('0', true) | string == '0'
          - records[0].dnszone_name == dns_zone
          - records[0].rr_id | int > 0
        fail_msg: >-
          The application CNAME was not returned with the requested target {{ fqdn }}. No successful application alias
          publication is claimed.
    - name: '[SOLIDserver REST] Apply the selected TTL to the application alias if needed'
      ansible.builtin.uri:
        url: >-
          https://{{ solidserver.host }}/rest/dns_rr_add?{{ {'rr_id': records[0].rr_id, 'rr_ttl': ttl, 'add_flag': 'edit_only'}
          | urlencode }}
        method: PUT
        status_code:
          - 200
          - 201
          - 204
      when:
        - records | length == 1
        - records[0].ttl | default(-1) | int != ttl | int
      register: ttl_update
      failed_when: false
      changed_when: false
      no_log: true
    - name: Validate the TTL update response and show any API error safely
      ansible.builtin.assert:
        that:
          - ttl_update.status | default(-1) | int in [200, 201, 204]
          - ttl_api_codes | reject('equalto', 0) | list | length == 0
        fail_msg: >-
          TTL update was not confirmed for {{ app_fqdn }}, record_id={{ records[0].rr_id }}, requested_TTL={{ ttl }}.
          {{ ttl_diagnostic }} No successful publication is claimed.
      when: ttl_update is not skipped
    - name: '[SOLIDserver REST] Read back the application alias and requested TTL'
      ansible.builtin.uri:
        url: >-
          https://{{ solidserver.host }}/rest/dns_rr_list?{{ {'WHERE': "dns_name='" ~ dns_server ~ "' and rr_full_name='"
          ~ app_fqdn ~ "'", 'limit': 2} | urlencode }}
      register: dns_readback
      failed_when: |-
        dns_readback.status not in [200, 204] or (dns_readback.status == 200 and
         (dns_readback.json is not defined or dns_readback.json | type_debug != 'list')) or
        (dns_readback.json | default([]) | selectattr('errno', 'defined') | rejectattr('errno', 'in', [0, '0']) | list | length > 0)
      no_log: true
    - name: Verify the application alias target, identity and selected TTL
      ansible.builtin.assert:
        that:
          - actual | length == 1
          - actual[0].rr_type | default('') == 'CNAME'
          - actual[0].value1 | default('') | lower | regex_replace('[.]$', '') == fqdn | lower
          - actual[0].ttl | default(-1) | int == ttl | int
          - actual[0].dnsview_id | default('0', true) | string == '0'
          - actual[0].dnszone_name | default('') == dns_zone
          - actual[0].rr_id | string == records[0].rr_id | string
        fail_msg: >-
          Application alias read-back does not match {{ app_fqdn }} CNAME {{ fqdn }} with TTL={{ ttl }}. No successful
          publication is claimed. {{ ttl_diagnostic if ttl_update is not skipped else "No TTL update was needed." }}
      changed_when: ttl_update is not skipped
      vars:
        actual: '{{ dns_readback.json | default([]) }}'
    - name: Show the application DNS name and its host target
      ansible.builtin.debug:
        msg: >-
          {{ app_fqdn }} CNAME {{ fqdn }}. TTL={{ ttl }}.
